name: CI

on:
  push:
    branches: [main]
  pull_request:

# ═══════════════════════════════════════════════════════════════════════════════
# Portões de CI — doc 00, seção 11.
#
# Seis portões. Os três primeiros são higiene; os três últimos existem porque a
# violação correspondente é uma falha de segurança ou de governança de dados que
# revisão humana não pega de forma confiável.
# ═══════════════════════════════════════════════════════════════════════════════

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: Lint, tipos e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Sem `version:` — a fonte é o campo packageManager do package.json.
      # Declarar nos dois lugares faz a action abortar com ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Portão 1 — lint. Inclui as regras de FRONTEIRA de import (eslint.config.mjs):
      # o gateway externo não alcança módulo interno; o dicionário de métricas não
      # depende de aplicação; as superfícies não reusam tela entre si.
      - name: Portão 1 — lint e fronteiras de import
        run: pnpm lint

      - name: Portão 2 — tipos
        run: pnpm typecheck

      - name: Portão 3 — build
        run: pnpm build

  isolamento:
    name: Isolamento de tenant
    runs-on: ubuntu-latest

    # ─────────────────────────────────────────────────────────────────────────
    # Portão 4 — O PORTÃO QUE MAIS IMPORTA.
    #
    # Roda contra Postgres real, não contra simulação. Verifica que o BANCO
    # recusa, mesmo que a aplicação erre: RLS forçado, tenant transaction-local
    # que não vaza no pool, papel externo com USAGE em exatamente um esquema,
    # k-anonimato imposto por CHECK, `fact` append-only.
    #
    # `--test-force-exit` não é usado de propósito: se o teste for pulado por
    # falta de banco, o passo seguinte falha explicitamente. Suíte de segurança
    # que passa por não ter rodado é pior que suíte que falha.
    # ─────────────────────────────────────────────────────────────────────────
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: teste
          POSTGRES_DB: ops
        ports: ['5434:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d ops"
          --health-interval 10s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4
      # Sem `version:` — a fonte é o campo packageManager do package.json.
      # Declarar nos dois lugares faz a action abortar com ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ops/db build

      - name: Portão 4 — isolamento de tenant (Postgres real)
        env:
          DATABASE_URL_ADMIN: postgres://postgres:teste@127.0.0.1:5434/ops
        run: |
          node --test packages/db/dist/rls.test.js 2>&1 | tee resultado.txt
          if grep -qE '^# skipped [1-9]' resultado.txt; then
            echo "::error::Testes de isolamento foram PULADOS. Sem banco, este portão não protege nada."
            exit 1
          fi

      # Invariantes de domínio: as regras que o banco impõe porque disciplina de
      # processo não sobrevive a pressa — dedup da fila, as duas confirmações do
      # efeito na receita, cascata que fecha, competência congelada.
      - name: Portão 4b — invariantes de domínio (Postgres real)
        env:
          DATABASE_URL_ADMIN: postgres://postgres:teste@127.0.0.1:5434/ops
        run: |
          node --test packages/db/dist/invariantes.test.js 2>&1 | tee inv.txt
          if grep -qE '^# skipped [1-9]' inv.txt; then
            echo "::error::Invariantes de domínio foram PULADAS."
            exit 1
          fi

      # O executor de ciclos: a semântica de falha só é verificável contra banco
      # real, porque o que importa é o efeito em watermark, cycle_run e trava.
      - name: Portão 4c — executor de ciclos (Postgres real)
        env:
          DATABASE_URL_ADMIN: postgres://postgres:teste@127.0.0.1:5434/ops
        run: |
          pnpm --filter @ops/worker build
          node --test apps/worker/dist/runner.test.js 2>&1 | tee run.txt
          if grep -qE '^# skipped [1-9]' run.txt; then
            echo "::error::Testes do executor foram PULADOS."
            exit 1
          fi

      # A massa sintética é o que destrava construir o produto sem a réplica.
      # Reexecução é a operação mais comum, e é justamente a que falha primeiro.
      - name: Portão 4d — seed contra banco real
        env:
          DATABASE_URL_ADMIN: postgres://postgres:teste@127.0.0.1:5434/ops
        run: |
          node --test packages/db/dist/seed/seed-db.test.js 2>&1 | tee seed.txt
          if grep -qE '^# skipped [1-9]' seed.txt; then
            echo "::error::Testes do seed foram PULADOS."
            exit 1
          fi

      # A consolidação: primeiro caminho de ponta a ponta do repositório —
      # fatos gerados, sinais calculados, agregados publicados com supressão.
      - name: Portão 4e — consolidação (Postgres real)
        env:
          DATABASE_URL_ADMIN: postgres://postgres:teste@127.0.0.1:5434/ops
        run: |
          node --test apps/worker/dist/consolidacao.test.js 2>&1 | tee cons.txt
          if grep -qE '^# skipped [1-9]' cons.txt; then
            echo "::error::Testes da consolidação foram PULADOS."
            exit 1
          fi

      # A fila é o que o CSM abre de manhã. As quatro regras que decidem se ela
      # continua sendo usada no terceiro mês — teto, deduplicação por família,
      # carência e modo sombra — só se testam contra banco real.
      - name: Portão 4f — fila de trabalho (Postgres real)
        env:
          DATABASE_URL_ADMIN: postgres://postgres:teste@127.0.0.1:5434/ops
        run: |
          node --test apps/worker/dist/fila.test.js 2>&1 | tee fila.txt
          if grep -qE '^# skipped [1-9]' fila.txt; then
            echo "::error::Testes da fila foram PULADOS."
            exit 1
          fi

      # A declaração dos ciclos alimenta o painel de pipeline: ele precisa
      # mostrar o que está de fato rodando, não o que estava no código dele.
      - name: Portão 4g — declaração dos ciclos (Postgres real)
        env:
          DATABASE_URL_ADMIN: postgres://postgres:teste@127.0.0.1:5434/ops
        run: node --test apps/worker/dist/registro.test.js

      # Portão 5 — migrations aplicam E revertem em banco limpo.
      # Migration que sobe e não desce transforma rollback em incidente.
      - name: Portão 5 — migrations idempotentes
        env:
          DATABASE_URL_ADMIN: postgres://postgres:teste@127.0.0.1:5434/ops
        run: |
          # Reaplicar não deve mudar nada nem falhar.
          node packages/db/dist/migrate.js
          node packages/db/dist/migrate.js

  governanca:
    name: Governança de métricas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Sem `version:` — a fonte é o campo packageManager do package.json.
      # Declarar nos dois lugares faz a action abortar com ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Portão 6 — toda métrica tem dono, fórmula e explicação; nenhuma está
      # duplicada; os pesos dos drivers somam 100. Doc 00, 6.5.
      # Sem isto, "dicionário de definições com responsável nomeado" volta a ser
      # uma promessa de documento.
      - name: Portão 6 — dicionário de métricas
        run: |
          pnpm --filter @ops/metrics build
          node --test packages/metrics/dist/metrics.test.js
          node --test packages/metrics/dist/drivers.test.js
          node --test packages/metrics/dist/gatilhos.test.js

      - name: Testes das demais unidades
        run: |
          pnpm --filter @ops/auth build && node --test packages/auth/dist/auth.test.js
          pnpm --filter @ops/contracts build && node --test packages/contracts/dist/contracts.test.js
          pnpm --filter @ops/worker build
          node --test apps/worker/dist/cycle.test.js
          node --test apps/worker/dist/quality.test.js
          pnpm --filter @ops/db build
          node --test packages/db/dist/seed/seed.test.js
