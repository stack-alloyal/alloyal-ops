# Advanced Config do proxy host ops.alloyal.com.br (Nginx Proxy Manager)
# Aplicado via API do NPM. Fonte de verdade versionada.
#
# Além do SSO, este arquivo injeta o SEGREDO que prova à aplicação que a
# requisição passou por aqui. Sem ele, `X-Auth-Request-Email` é apenas um texto
# que qualquer contêiner da VM consegue escrever — e a aplicação recusa
# autenticar, que é o comportamento desejado.
#
# NOTA nginx (armadilha da casa): add_header de nível server é ANULADO em
# location que já tem add_header, e o include proxy.conf do NPM tem um. Por isso
# os headers de segurança ficam DENTRO de cada location.

proxy_hide_header X-Powered-By;

location /oauth2/ {
    proxy_pass http://oauth2-proxy-ops:4180;
    proxy_set_header Host                    $host;
    proxy_set_header X-Real-IP               $remote_addr;
    proxy_set_header X-Forwarded-For         $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto       $scheme;
    proxy_set_header X-Auth-Request-Redirect $request_uri;
}

location = /oauth2/auth {
    proxy_pass http://oauth2-proxy-ops:4180;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Content-Length    "";
    proxy_pass_request_body            off;
}

location / {
    auth_request /oauth2/auth;
    error_page 401 = /oauth2/start?rd=$scheme://$host$request_uri;

    # O oauth2-proxy devolve a identidade; o NPM a repassa adiante.
    auth_request_set $email $upstream_http_x_auth_request_email;
    proxy_set_header X-Auth-Request-Email $email;

    # A prova. Precisa bater com OPS_PROXY_SECRET no .env da aplicação.
    # Trocar aqui exige trocar lá — e enquanto não baterem, ninguém entra.
    proxy_set_header X-Ops-Proxy-Secret "SUBSTITUIR_PELO_MESMO_VALOR_DE_OPS_PROXY_SECRET";

    # Cabeçalho vindo de fora nunca chega à aplicação: se um cliente enviar o
    # seu próprio X-Ops-Proxy-Secret, o proxy_set_header acima o sobrescreve —
    # mas o de identidade também precisa ser neutralizado explicitamente.
    proxy_set_header X-Auth-Request-User "";

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    include conf.d/include/proxy.conf;
}
