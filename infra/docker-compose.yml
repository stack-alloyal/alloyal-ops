# ═════════════════════════════════════════════════════════════════════════════
# Alloyal Pulse — stack da aplicação
#
# Segue as convenções da plataforma compartilhada (/opt/stack):
#   • `name:` FIXADO — preserva os volumes independente do path de deploy.
#     Renomear a pasta ou remover esta linha faz o Docker criar volumes NOVOS
#     VAZIOS. Perda de banco. Não mexer.
#   • redes externas `proxy-net` (web) e `data-net` (dados), criadas por
#     `bash /opt/stack/bootstrap.sh`.
#   • sem `depends_on` para serviços de outros projetos: o acoplamento é rede
#     mais credencial.
#   • ingresso só pelo Nginx Proxy Manager (80/443). Nenhuma porta pública aqui.
#   • ARM64 (Oracle Cloud Ampere). Todas as imagens abaixo têm arm64.
#
# POR QUE POSTGRES E REDIS PRÓPRIOS, e não os compartilhados de /opt/stack:
# o Pulse roda varredura completa de base elegível e reconciliação de 90 dias toda
# madrugada, sobre milhões de linhas. Dividir instância com Hub e Evolution é
# convidar contenção de I/O, estouro de conexões e autovacuum competindo — e o
# `pg_dumpall` compartilhado passaria a levar o tempo do maior banco. Precedente
# na casa: `postgres-enable`. Decisão C-01/C-04 (doc 02).
# ═════════════════════════════════════════════════════════════════════════════

name: alloyal-pulse

services:
  # ─── Banco ─────────────────────────────────────────────────────────────────
  postgres-pulse:
    image: postgres:16
    container_name: postgres-pulse
    restart: always
    environment:
      POSTGRES_DB: pulse
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PULSE_PASSWORD:?defina no .env}
      # Fronteira de dia é calculada em America/Sao_Paulo nas queries; o servidor
      # fica em UTC de propósito (ADR-008).
      TZ: UTC
      PGTZ: UTC
    command:
      - postgres
      # Ajustes para carga de ETL noturna em VM de 4 vCPU / 23 GB.
      # Revisar depois do spike de volumetria (doc 02, B.2) — estes são ponto de
      # partida, não resultado de medição.
      - -c
      - shared_buffers=2GB
      - -c
      - effective_cache_size=6GB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - work_mem=32MB
      - -c
      - max_connections=120
      - -c
      - random_page_cost=1.1
      - -c
      - log_min_duration_statement=2000
      - -c
      - timezone=UTC
    volumes:
      - postgres_ops_data:/var/lib/postgresql/data
    ports:
      # Só loopback, e em 5434: 5432 e 5433 já estão ocupados na VM pelo Postgres
      # compartilhado e pelo Supabase do Metas.
      - '127.0.0.1:5434:5432'
    networks:
      - pulse-net
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d ops']
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Fila ──────────────────────────────────────────────────────────────────
  redis-pulse:
    image: redis:7
    container_name: redis-pulse
    restart: always
    # `noeviction` é obrigatório para BullMQ: com política de evicção, o Redis
    # descarta job sob pressão de memória e a perda é silenciosa.
    command: >
      redis-server --appendonly yes
      --requirepass ${REDIS_PULSE_PASSWORD:?defina no .env}
      --maxmemory 512mb --maxmemory-policy noeviction
    volumes:
      - redis_ops_data:/data
    networks:
      - pulse-net
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Ingestão e consolidação ───────────────────────────────────────────────
  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: worker
    container_name: pulse-worker-app
    restart: always
    env_file: .env
    environment:
      NODE_ENV: production
      TZ: UTC
      # Montada aqui pelo mesmo motivo da web-internal: a senha do role vive só em
      # PULSE_WORKER_PASSWORD. `db.ts` prefere DATABASE_URL_WORKER, e é este valor.
      DATABASE_URL_WORKER: postgres://pulse_worker:${PULSE_WORKER_PASSWORD:?defina no .env}@postgres-pulse:5432/pulse
      REDIS_URL: redis://:${REDIS_PULSE_PASSWORD:?defina no .env}@redis-pulse:6379
    networks:
      - pulse-net
      # Sai para as APIs externas (HubSpot, CleverTap, Omie) e alcança a réplica.
      - default
    depends_on:
      postgres-pulse:
        condition: service_healthy
      redis-pulse:
        condition: service_healthy

  # ─── Superfície interna ────────────────────────────────────────────────────
  web-internal:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: web-internal
    container_name: pulse-web-internal
    restart: always
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: '3000'
      # Conecta como pulse_api: sem acesso a public_v (migration 0005).
      # A URL é MONTADA aqui, e não lida do .env pronta. A senha vive num lugar só
      # (PULSE_API_PASSWORD, no SOPS): escrever a URL inteira à mão punha a mesma senha
      # em duas linhas, e na primeira rotação uma das duas fica velha — com sintoma de
      # "autenticação falhou" que ninguém liga a um .env desatualizado.
      DATABASE_URL: postgres://pulse_api:${PULSE_API_PASSWORD:?defina no .env}@postgres-pulse:5432/pulse
      # Prova de que a requisição passou pelo proxy. Sem isto a aplicação
      # recusa autenticar — e é assim que se quer que ela falhe.
      PULSE_PROXY_SECRET: ${PULSE_PROXY_SECRET:?defina no .env}
      AUTH_DOMINIO: ${AUTH_DOMINIO:-alloyal.com.br}
    # NENHUMA porta publicada. A identidade chega por cabeçalho, e cabeçalho é
    # falsificável por quem fala direto com a aplicação. Defesa em duas camadas:
    # sem porta exposta, e a aplicação só aceita o cabeçalho de identidade quando
    # a requisição traz o SEGREDO que o proxy injeta (ADR-016). Em Server
    # Component não há acesso ao endereço de rede de quem chamou — por isso a
    # prova é um segredo, e não uma faixa de IP.
    networks:
      - pulse-net
      - proxy-net
    depends_on:
      postgres-pulse:
        condition: service_healthy

  # ─── oauth2-proxy da superfície interna ────────────────────────────────────
  # Uma instância por domínio: redirect-url e cookie-domain são por domínio.
  # Mesma imagem e mesmo padrão dos outros apps da casa.
  oauth2-proxy-pulse:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.3
    container_name: oauth2-proxy-pulse
    restart: always
    env_file: oauth2.env
    command:
      - --http-address=0.0.0.0:4180
      - --reverse-proxy=true
      - --trusted-proxy-ip=172.16.0.0/12
      - --provider=google
      - --email-domain=alloyal.com.br
      - --redirect-url=https://pulse.alloyal.com.br/oauth2/callback
      - --whitelist-domain=pulse.alloyal.com.br
      - --cookie-domain=pulse.alloyal.com.br
      - --cookie-secure=true
      - --cookie-csrf-per-request=true
      - --cookie-csrf-expire=5m
      - --set-xauthrequest=true
      - --skip-provider-button=true
      - --upstream=static://200
    networks:
      - proxy-net

  # ─── Superfície do cliente ─────────────────────────────────────────────────
  # SEM oauth2-proxy: o acesso é por magic link, para gestor que não tem conta
  # Google da Alloyal. Domínio separado para ter CSP, limite de taxa e política
  # de cookie próprios.
  web-portal:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: web-portal
    container_name: pulse-web-portal
    restart: always
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: '3000'
      # Conecta como pulse_portal: só public_v, só SELECT, sob RLS forçado.
      DATABASE_URL: postgres://pulse_portal:${PULSE_PORTAL_PASSWORD:?defina no .env}@postgres-pulse:5432/pulse
    networks:
      - pulse-net
      - proxy-net
    depends_on:
      postgres-pulse:
        condition: service_healthy

volumes:
  postgres_ops_data:
  redis_ops_data:

networks:
  # Rede interna do projeto: banco e fila não são alcançáveis de outros apps.
  pulse-net:
    driver: bridge
  # Compartilhada com o Nginx Proxy Manager (criada por /opt/stack/bootstrap.sh).
  proxy-net:
    external: true
