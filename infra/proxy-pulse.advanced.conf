# Advanced Config do proxy host pulse.alloyal.com.br (Nginx Proxy Manager)
# Aplicado via API do NPM. Fonte de verdade versionada.
#
# Além do SSO, este arquivo injeta o SEGREDO que prova à aplicação que a
# requisição passou por aqui. Sem ele, `X-Auth-Request-Email` é apenas um texto
# que qualquer contêiner da VM consegue escrever — e a aplicação recusa
# autenticar, que é o comportamento desejado.
#
# NOTA nginx (armadilha da casa): add_header de nível server é ANULADO em
# location que já tem add_header, e o include proxy.conf do NPM tem um.

proxy_hide_header X-Powered-By;

location /oauth2/ {
    proxy_pass http://oauth2-proxy-pulse:4180;
    proxy_set_header Host                    $host;
    proxy_set_header X-Real-IP               $remote_addr;
    proxy_set_header X-Forwarded-For         $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto       $scheme;
    proxy_set_header X-Auth-Request-Redirect $request_uri;
}

location = /oauth2/auth {
    proxy_pass http://oauth2-proxy-pulse:4180;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Content-Length    "";
    proxy_pass_request_body            off;
}

# ── A porta de entrada é a tela do OAUTH2-PROXY ──────────────────────────────
#
# Quem não tem sessão vai para /oauth2/start, e lá o oauth2-proxy serve
# `infra/oauth2-templates/sign_in.html` — a mesma mecânica do Publi.
#
# Houve aqui uma `location @login` que mandava o não autenticado para a
# aplicação renderizar a tela em React. Foi removida: com o template no
# oauth2-proxy, as duas juntas dariam DUAS telas de login em sequência.
#
# A escolha entre as duas não é óbvia, e o que decidiu foi operacional:
#
#   · Template no oauth2-proxy — vale sem tocar no NPM, e a tela aparece mesmo
#     com a aplicação ou o Postgres fora do ar, porque o oauth2-proxy responde
#     antes deles. Custo: o desenho existe em dois lugares.
#   · Tela da aplicação — uma renderização só, mas exige reaplicar este arquivo
#     no proxy host a cada mudança, e some se a aplicação cair.
#
# O custo do template é a divergência, que é real: a tela do Publi e a do
# Allvoice já divergiram por isso. A amarra é um PORTÃO —
# `packages/ui/design-system.test.mjs` compara cor e texto do `sign_in.html`
# com os tokens e com o `Login.tsx`, e recusa a diferença.
#
# `apps/web-internal/app/(interno)/entrar/page.tsx` continua existindo para quem
# alcança a aplicação sem passar por aqui.

# ── Saúde: FORA da autenticação, e é decisão ─────────────────────────────────
#
# Sem esta location o `/api/health` cai na `location /`, o `auth_request` recusa,
# o `error_page 401` devolve a TELA DE ENTRADA — e ela responde 200.
#
# Provado com a aplicação PARADA: `curl https://pulse.alloyal.com.br/api/health`
# devolvia 200 com HTML. Qualquer monitor apontado ali reportaria o serviço
# saudável durante uma queda total — a pior classe de monitoramento, o que mente
# justamente na hora em que se precisa dele.
#
# Sem `auth_request`, a resposta passa a vir da aplicação: 200 com JSON quando ela
# está de pé, 502 quando não está. O corpo é
# `{"ok":true,"superficie":"interna","ts":...}` — sem dado de cliente, sem versão
# e sem nome de host. O Publi expõe o dele do mesmo jeito, por `--skip-auth-route`.
location = /api/health {
    include conf.d/include/proxy.conf;
}

location / {
    auth_request /oauth2/auth;
    # `/oauth2/sign_in`, e NÃO `/oauth2/start`. A diferença não é óbvia e é a
    # razão de a tela não aparecer: `/oauth2/start` SEMPRE redireciona ao
    # provedor; quem serve a página de entrada é `/oauth2/sign_in`. O
    # `--skip-provider-button` é o que decide entre as duas — com ele ligado,
    # `sign_in` também pula direto, que era o estado anterior.
    #
    # Sem `?rd=` aqui: a rota de retorno viaja no cabeçalho
    # `X-Auth-Request-Redirect`, que a location /oauth2/ já define com
    # `$request_uri` — e `$request_uri` continua sendo o caminho ORIGINAL depois
    # do redirecionamento interno, que é exatamente o que se quer.
    error_page 401 = /oauth2/sign_in;

    # A identidade vem da RESPOSTA do oauth2-proxy, nunca do cliente. É a linha
    # que impede o ataque óbvio: alguém enviar `X-Auth-Request-Email: lider@...`
    # e ser aceito. `$email` sobrescreve o que veio de fora, e quando o
    # oauth2-proxy não devolve nada o valor fica vazio e a aplicação recusa —
    # falha fechada.
    auth_request_set $email $upstream_http_x_auth_request_email;
    proxy_set_header X-Auth-Request-Email $email;

    # A prova. Precisa bater com PULSE_PROXY_SECRET no .env da aplicação.
    # Trocar aqui exige trocar lá — e enquanto não baterem, ninguém entra.
    proxy_set_header X-Pulse-Proxy-Secret "SUBSTITUIR_PELO_MESMO_VALOR_DE_PULSE_PROXY_SECRET";

    # Cabeçalho vindo de fora nunca chega à aplicação: se um cliente enviar o
    # seu próprio X-Pulse-Proxy-Secret, o proxy_set_header acima o sobrescreve —
    # mas o de identidade também precisa ser neutralizado explicitamente.
    proxy_set_header X-Auth-Request-User "";

    # ── Cabeçalhos de segurança: NÃO são definidos aqui, e é decisão ──────────
    #
    # Este arquivo os tinha, com valores DIFERENTES dos da aplicação:
    #
    #   X-Frame-Options            SAMEORIGIN  aqui  ×  DENY      na app
    #   Strict-Transport-Security  63072000    aqui  ×  31536000  na app
    #   Referrer-Policy            strict-origin-when-cross-origin × no-referrer
    #
    # Dois `add_header` com o mesmo nome entregam DOIS valores ao navegador, e
    # qual vale passa a depender de implementação. Nos três casos o valor daqui
    # era o mais FROUXO — em especial `Referrer-Policy`: a app usa `no-referrer`
    # porque a URL interna carrega id de conta e de relatório, e vazá-la no
    # `Referer` de um link externo é vazar o cliente. O `X-Frame-Options`
    # SAMEORIGIN também contradizia a CSP `frame-ancestors 'none'` da app.
    #
    # Um dono só: `packages/ui/cabecalhos.mjs`, versionado junto com o código que
    # sabe por que cada valor é aquele.
    #
    # Custo aceito: página de erro servida pelo próprio NPM (502, 504) sai sem
    # esses cabeçalhos. É página sem conteúdo de cliente, e vale menos que a
    # certeza de qual valor está em vigor nas páginas que têm conteúdo.
    #
    # A TELA DE ENTRADA está nesse custo: ela vem do oauth2-proxy, não da
    # aplicação, então sai sem os cinco cabeçalhos. É página sem conteúdo de
    # cliente — só marca, texto e um link — e o mesmo já vale para o Publi.

    include conf.d/include/proxy.conf;
}
