# Advanced Config do proxy host docs.alloyal.com.br (Nginx Proxy Manager)
# Aplicado via API do NPM. Fonte de verdade versionada.
#
# O site INTEIRO é protegido — diferente do evolution, onde só /manager exige
# sessão. Aqui não há API nem webhook: tudo é documento para humano.
#
# NOTA nginx (armadilha da casa): add_header de nível server é ANULADO em
# location que já tem add_header, e o include proxy.conf do NPM tem um. Por isso
# os headers de segurança ficam DENTRO de cada location. proxy_hide_header É
# herdado, então fica em nível de server.

proxy_hide_header X-Powered-By;
proxy_hide_header Server;

# ---- Endpoints do oauth2-proxy ----
location /oauth2/ {
    proxy_pass http://oauth2-proxy-docs:4180;
    proxy_set_header Host                    $host;
    proxy_set_header X-Real-IP               $remote_addr;
    proxy_set_header X-Forwarded-For         $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto       $scheme;
    proxy_set_header X-Auth-Request-Redirect $request_uri;
}

location = /oauth2/auth {
    proxy_pass http://oauth2-proxy-docs:4180;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Content-Length    "";
    proxy_pass_request_body            off;
}

# ---- Todo o resto: exige sessão Google @alloyal.com.br ----
location / {
    auth_request /oauth2/auth;
    error_page 401 = /oauth2/start?rd=$scheme://$host$request_uri;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    include conf.d/include/proxy.conf;
}
