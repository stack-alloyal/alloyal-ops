# Servidor estático da documentação. Fica atrás do oauth2-proxy e do NPM —
# não escuta em porta pública e não faz TLS (o NPM termina).
server {
    listen 80;
    server_name _;
    charset utf-8;
    root /usr/share/nginx/html;
    index index.html;

    # Sem listagem de diretório: um documento a mais no diretório não deve
    # virar link público por acidente.
    autoindex off;

    # Conteúdo interno: fora de índice de busca mesmo estando atrás de SSO.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;

    gzip on;
    gzip_types text/html text/css text/markdown application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Health check do compose, sem passar por autenticação.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Markdown é servido como texto legível, não como download.
    location ~* \.md$ {
        default_type text/plain;
        charset utf-8;
    }

    # HTML nunca é cacheado: documento revisado precisa aparecer revisado.
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
